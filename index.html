<body>
<header><div class="title"><h1>迷路（仮）</h1><span class="version">v1.14</span></div><button id="new" class="primary">新規迷路</button></header>
<dialog id="size-dialog" aria-labelledby="size-title"><div class="dialog-heading"><h2 id="size-title">サイズ</h2><button id="close-size" class="secondary" aria-label="閉じる">×</button></div><div class="sizes" role="group" aria-label="迷路のサイズ"><button data-size="15" aria-pressed="false">小</button><button data-size="25" aria-pressed="true">中</button><button data-size="35" aria-pressed="false">大</button><button data-size="51" aria-pressed="false">巨大</button></div></dialog>
<main>
<div class="board"><canvas id="maze" tabindex="0" aria-label="迷路"></canvas><div id="win" class="win" hidden><h2>ゴール</h2><button id="again" class="primary">もう一度</button></div></div>
<div class="bottom"><button id="footprints" class="secondary" aria-pressed="false">足跡：非表示</button><button id="reset" class="secondary">最初から</button></div>
<div class="dpad" aria-label="移動と停止"><button data-dir="0" aria-label="上へ">↑</button><button data-dir="3" aria-label="左へ">←</button><button id="stop" aria-label="停止">■<small>停止</small></button><button data-dir="1" aria-label="右へ">→</button><button data-dir="2" aria-label="下へ">↓</button></div>

<script>

// player.png: 96×48, left-facing; frame 0 idle, frame 1 walking.
const $=id=>document.getElementById(id),canvas=$('maze'),ctx=canvas.getContext('2d');
const dirs=[[0,-1],[1,0],[0,1],[-1,0]],TILE=80,SPRITE=48,SPEED=85,ZOOM=1.6;
let n,cells,player,start,goal,exitDir,done=false,segment=null,heading=1,facing=1;
let px=40,py=40,lastTime=null,paused=false,showFootprints=false,footprints=new Map(),footDistance=0;
let selectedSize=25,walkingSince=null,idleAt=0,modalResume=false;
const FRAME_MS=260,OUTSIDE=-1,TRAIL_STEP=20;let trailDotsCache=null;

const SAVE_KEY='meze-save-v1';let saveDirty=false,lastSaveAt=0;
function markSave(){saveDirty=true;}
function saveGame(){
 if(!cells||!saveDirty)return;
 try{localStorage.setItem(SAVE_KEY,JSON.stringify({schema:1,n,start,goal,exitDir,player,px,py,segment:segment?{...segment}:null,done,heading,facing,showFootprints,footDistance,
 walls:cells.map(c=>c.walls.reduce((mask,w,d)=>mask|(w?1<<d:0),0)),footprints:Array.from(footprints.values(),p=>[p.x,p.y,p.d])}));saveDirty=false;lastSaveAt=performance.now();}catch{lastSaveAt=performance.now();/* Keep playing when storage is unavailable or full. */}
}
function restoreGame(){
 try{
 const text=localStorage.getItem(SAVE_KEY);if(!text)return false;const saved=JSON.parse(text),size=saved.n;
 const int=Number.isInteger,dir=d=>int(d)&&d>=0&&d<4,cell=i=>int(i)&&i>=0&&i<size*size;
 if(saved.schema!==1||![15,25,35,51].includes(size)||!cell(saved.start)||!cell(saved.goal)||!dir(saved.exitDir)||typeof saved.done!=='boolean'||typeof saved.showFootprints!=='boolean'||!dir(saved.heading)||![1,3].includes(saved.facing))return false;
 if(saved.start!==Math.floor(size/2)*size+Math.floor(size/2)||!Array.isArray(saved.walls)||saved.walls.length!==size*size||saved.walls.some(w=>!int(w)||w<0||w>15))return false;
 const g=saved.goal,gx=g%size,gy=Math.floor(g/size);if(!(saved.exitDir===0?gy===0:saved.exitDir===1?gx===size-1:saved.exitDir===2?gy===size-1:gx===0))return false;
 const wall=(i,d)=>!!(saved.walls[i]&(1<<d));
 for(let i=0;i<size*size;i++)for(let d=0;d<4;d++){const x=i%size+dirs[d][0],y=Math.floor(i/size)+dirs[d][1];if(x<0||y<0||x>=size||y>=size){if(wall(i,d)!==!(i===g&&d===saved.exitDir))return false;}else if(wall(i,d)!==wall(y*size+x,(d+2)%4))return false;}
 const reachable=new Set([saved.start]),queue=[saved.start];for(let k=0;k<queue.length;k++)for(let d=0;d<4;d++){const i=queue[k];if(wall(i,d)||(i===g&&d===saved.exitDir))continue;const j=i+dirs[d][0]+dirs[d][1]*size;if(!reachable.has(j)){reachable.add(j);queue.push(j);}}if(reachable.size!==size*size)return false;
 if(saved.done?(saved.player!==OUTSIDE||saved.segment!==null):!cell(saved.player))return false;
 const pos=i=>i===OUTSIDE?[(gx+.5+dirs[saved.exitDir][0])*TILE,(gy+.5+dirs[saved.exitDir][1])*TILE]:[(i%size+.5)*TILE,(Math.floor(i/size)+.5)*TILE];
 let expected=pos(saved.player);
 if(saved.segment!==null){const seg=saved.segment;if(!seg||!dir(seg.d)||!Number.isFinite(seg.t)||seg.t<0||seg.t>1||!((cell(seg.from)&&cell(seg.to))||(seg.from===g&&seg.to===OUTSIDE)||(seg.from===OUTSIDE&&seg.to===g)))return false;
 const [ax,ay]=pos(seg.from),[bx,by]=pos(seg.to);if(bx-ax!==dirs[seg.d][0]*TILE||by-ay!==dirs[seg.d][1]*TILE)return false;
 if(cell(seg.from)&&wall(seg.from,seg.d))return false;if(seg.from===OUTSIDE&&seg.d!==(saved.exitDir+2)%4)return false;
 if(saved.player!==seg.from&&saved.player!==seg.to)return false;
 expected=[ax+(bx-ax)*seg.t,ay+(by-ay)*seg.t];}
 if(!Number.isFinite(saved.px)||!Number.isFinite(saved.py)||Math.abs(saved.px-expected[0])>1e-4||Math.abs(saved.py-expected[1])>1e-4||!Number.isFinite(saved.footDistance)||saved.footDistance<0||saved.footDistance>=22)return false;
 if(!Array.isArray(saved.footprints)||saved.footprints.length>200000||saved.footprints.some(p=>!Array.isArray(p)||p.length!==3||!Number.isFinite(p[0])||!Number.isFinite(p[1])||p[0]<-TILE||p[1]<-TILE||p[0]>(size+1)*TILE||p[1]>(size+1)*TILE||!dir(p[2])))return false;
 n=size;selectedSize=size;start=saved.start;goal=g;exitDir=saved.exitDir;player=saved.player;px=saved.px;py=saved.py;done=saved.done;heading=saved.heading;facing=saved.facing;
 cells=saved.walls.map(mask=>({walls:[0,1,2,3].map(d=>!!(mask&(1<<d)))}));segment=saved.segment;paused=!!segment;walkingSince=null;idleAt=0;lastTime=null;showFootprints=saved.showFootprints;footDistance=saved.footDistance%TRAIL_STEP;
 footprints=new Map();trailDotsCache=null;for(const [x,y,d] of saved.footprints)stamp(x,y,d);
 $('win').hidden=!done;syncFootprintsButton();document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.size)===n)));saveDirty=false;return true;
 }catch{return false;}
}
function syncFootprintsButton(){$('footprints').setAttribute('aria-pressed',String(showFootprints));$('footprints').textContent=showFootprints?'足跡：表示':'足跡：非表示';}

const sprite=new Image();let spriteReady=false;
sprite.onload=()=>{spriteReady=sprite.naturalWidth===96&&sprite.naturalHeight===48;};
sprite.onerror=()=>{spriteReady=false;};
sprite.src='./player.png';
function generate(size,entrance,target){
 const a=Array.from({length:size*size},()=>({walls:[true,true,true,true],seen:false}));
 const nearby=i=>{const x=i%size,y=Math.floor(i/size);return dirs.map(([dx,dy],d)=>({d,j:(y+dy)*size+x+dx,x:x+dx,y:y+dy})).filter(v=>v.x>=0&&v.y>=0&&v.x<size&&v.y<size);};
 const open=(i,d,j)=>{a[i].walls[d]=false;a[j].walls[(d+2)%4]=false;};
 const pick=list=>list[Math.floor(Math.random()*list.length)];
 // Mix depth-first corridors with random frontier growth.
 const active=[entrance];a[entrance].seen=true;
 while(active.length){const k=Math.random()<.75?active.length-1:Math.floor(Math.random()*active.length),i=active[k],options=nearby(i).filter(v=>!a[v.j].seen);
 if(!options.length){active.splice(k,1);continue;}
 const {d,j}=pick(options);open(i,d,j);a[j].seen=true;active.push(j);
 }
 const degree=i=>a[i].walls.filter(w=>!w).length;
 // Join distant passages; reject tiny square loops and open-room clusters.
 function farEnough(from,to){const q=[[from,0]],seen=new Set([from]);for(let k=0;k<q.length;k++){const [i,dist]=q[k];if(i===to)return false;if(dist===6)continue;for(const v of nearby(i)){if(!a[i].walls[v.d]&&!seen.has(v.j)){seen.add(v.j);q.push([v.j,dist+1]);}}}return true;}
 function connect(i){const candidates=nearby(i).filter(v=>a[i].walls[v.d]&&farEnough(i,v.j));if(!candidates.length)return false;const preferred=candidates.filter(v=>degree(v.j)<3);const v=pick(preferred.length?preferred:candidates);open(i,v.d,v.j);return true;}
 const order=Array.from({length:size*size},(_,i)=>i);
 for(let k=order.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];}
 // Most dead ends become routes that rejoin another corridor.
 for(const i of order)if(degree(i)===1&&Math.random()<.85)connect(i);
 // Additional loops across the maze, while keeping walls and corridors.
 let extra=Math.floor(size*size*.045);for(const i of order){if(extra<=0)break;if(degree(i)<3&&connect(i))extra--;}
 // Give the entrance and exit more than one approach when possible.
 for(const i of [entrance,target])if(degree(i)===1)connect(i);
 // Ensure that the exit can be reached by two distinct routes from the entrance.
 const parents=new Map([[entrance,null]]),routeQ=[entrance];
 for(let k=0;k<routeQ.length&&!parents.has(target);k++)for(const v of nearby(routeQ[k]))if(!a[routeQ[k]].walls[v.d]&&!parents.has(v.j)){parents.set(v.j,routeQ[k]);routeQ.push(v.j);}
 let first=target;while(parents.get(first)!==entrance)first=parents.get(first);
 const reached=new Set([entrance]),q=[entrance];
 for(let k=0;k<q.length;k++)for(const v of nearby(q[k])){if((q[k]===entrance&&v.j===first)||(q[k]===first&&v.j===entrance))continue;if(!a[q[k]].walls[v.d]&&!reached.has(v.j)){reached.add(v.j);q.push(v.j);}}
 if(!reached.has(target)){const joins=[];for(const i of reached)for(const v of nearby(i))if(a[i].walls[v.d]&&!reached.has(v.j))joins.push({i,...v});const distant=joins.filter(v=>farEnough(v.i,v.j));const v=pick(distant.length?distant:joins);if(v)open(v.i,v.d,v.j);}
 return a;
}
function next(i,d){if(i===goal&&d===exitDir)return OUTSIDE;return i+dirs[d][0]+dirs[d][1]*n;}
function exits(i){return [0,1,2,3].filter(d=>!cells[i].walls[d]);}
function center(i){if(i===OUTSIDE){const [x,y]=center(goal);return [x+dirs[exitDir][0]*TILE,y+dirs[exitDir][1]*TILE];}return [(i%n+.5)*TILE,(Math.floor(i/n)+.5)*TILE];}
function reset(){player=start;walkingSince=null;idleAt=0;[px,py]=center(player);segment=null;done=false;heading=1;facing=1;paused=false;footprints=new Map();trailDotsCache=null;footDistance=0;lastTime=null;$('win').hidden=true;markSave();saveGame();}
function newGame(){n=selectedSize;const middle=Math.floor(n/2);start=middle*n+middle;
 // Pick a random side and an opening away from the corners.
 exitDir=Math.floor(Math.random()*4);const position=1+Math.floor(Math.random()*(n-2));
 goal=exitDir===0?position:exitDir===1?position*n+n-1:exitDir===2?(n-1)*n+position:position*n;
 cells=generate(n,start,goal);cells[goal].walls[exitDir]=false;reset();}
function startWalk(now){if(walkingSince===null)walkingSince=now;idleAt=0;}
function finishWalk(now){if(walkingSince!==null){const elapsed=Math.max(0,now-walkingSince),phase=Math.floor(elapsed/FRAME_MS);idleAt=phase%2===1?walkingSince+(phase+1)*FRAME_MS:0;}walkingSince=null;}
function animationFrame(now){if(segment&&!paused&&walkingSince!==null)return Math.floor(Math.max(0,now-walkingSince)/FRAME_MS)%2;return now<idleAt?1:0;}
function begin(d,now=performance.now()){if(done||cells[player].walls[d])return false;paused=false;stamp(px,py,d);startWalk(now);heading=d;if(d===1||d===3)facing=d;segment={from:player,to:next(player,d),d,t:0};return true;}
function command(d){markSave();
 if(done)return;
 if(segment){
 if(d===segment.d){paused=false;startWalk(performance.now());return;}
 if(d!==(segment.d+2)%4){return;}
 paused=false;startWalk(performance.now());
 // Reverse immediately even between cell centers, preserving position.
 const old=segment;segment={from:old.to,to:old.from,d,t:1-old.t};heading=d;if(d===1||d===3)facing=d;
 return;}
 begin(d);
}
let stopButtonState=null;
function syncStopButton(){const resume=!!segment&&paused;if(resume===stopButtonState)return;stopButtonState=resume;$('stop').innerHTML=resume?'▶<small>再開</small>':'■<small>停止</small>';$('stop').setAttribute('aria-label',resume?'再開':'停止');$('stop').title=resume?'再開':'停止';}
function stop(){if(done)return;if(segment){if(paused){paused=false;startWalk(performance.now());}else{finishWalk(performance.now());paused=true;}}syncStopButton();markSave();saveGame();}
function stamp(x,y,d){
 // One shared grid through cell centers, including every corner.
 const origin=TILE/2;
 x=origin+Math.round((x-origin)/TRAIL_STEP)*TRAIL_STEP;
 y=origin+Math.round((y-origin)/TRAIL_STEP)*TRAIL_STEP;
 d=d%2;const key=x+','+y+','+d;if(!footprints.has(key)){footprints.set(key,{x,y,d});trailDotsCache=null;}
}
function trailDots(){
 if(trailDotsCache)return trailDotsCache;
 const dots=new Map(),corners=new Map(),origin=TILE/2;
 const add=(x,y)=>dots.set(x+','+y,{x,y});
 for(const mark of footprints.values()){
  add(mark.x,mark.y+(mark.d===1?TRAIL_STEP:0));
  const x=origin+Math.round((mark.x-origin)/TILE)*TILE,y=origin+Math.round((mark.y-origin)/TILE)*TILE;
  if(Math.abs(mark.x-x)<=TRAIL_STEP&&Math.abs(mark.y-y)<=TRAIL_STEP)corners.set(x+','+y,{x,y});
 }
 // Connect both axes at visited corners, also repairing older saved trails.
 const has=(x,y,d)=>footprints.has(x+','+y+','+d);
 for(const {x,y} of corners.values()){
  const above=has(x,y-TRAIL_STEP,0),below=has(x,y+TRAIL_STEP,0);
  const vertical=has(x,y,0)||above||below;
  const horizontal=has(x,y,1)||has(x-TRAIL_STEP,y,1)||has(x+TRAIL_STEP,y,1);
  if(vertical&&horizontal){
   add(x,y+TRAIL_STEP);
   // A lower vertical arm already meets the lowered horizontal line.
   // Keep the center dot only when an upper arm needs that connecting step.
   if(above)add(x,y);else dots.delete(x+','+y);
  }
 }
 trailDotsCache=Array.from(dots.values());return trailDotsCache;
}
function complete(now=performance.now()){finishWalk(now);done=true;segment=null;$('win').hidden=false;markSave();saveGame();}
function advance(dt,now){
 let remaining=dt*SPEED/TILE;
 while(segment&&!paused&&remaining>0){const move=Math.min(remaining,1-segment.t),oldT=segment.t;segment.t+=move;remaining-=move;
 const distance=move*TILE;let first=TRAIL_STEP-footDistance;
 while(first<=distance){const t=oldT+first/TILE,[sx,sy]=center(segment.from);stamp(sx+dirs[segment.d][0]*t*TILE,sy+dirs[segment.d][1]*t*TILE,segment.d);first+=TRAIL_STEP;}
 footDistance=(footDistance+distance)%TRAIL_STEP;
 const [ax,ay]=center(segment.from),[bx,by]=center(segment.to);px=ax+(bx-ax)*segment.t;py=ay+(by-ay)*segment.t;
 if(segment.t<1)break;
 const arrived=segment.to,arrivalDirection=segment.d;player=arrived;stamp(px,py,arrivalDirection);segment=null;
 if(player===OUTSIDE){complete(now);break;}
 const forward=exits(player).filter(d=>d!==(arrivalDirection+2)%4);
 if(forward.length===1)begin(forward[0],now);else finishWalk(now);
 
 }
}
function resize(){const rect=canvas.getBoundingClientRect(),ratio=Math.min(devicePixelRatio||1,2);const w=Math.round(rect.width*ratio),h=Math.round(rect.height*ratio);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}return [rect.width,rect.height,ratio];}
function draw(now){
 const [viewW,viewH,ratio]=resize();if(!viewW||!viewH)return;const w=viewW/ZOOM,h=viewH/ZOOM;ctx.setTransform(ratio*ZOOM,0,0,ratio*ZOOM,0,0);ctx.imageSmoothingEnabled=false;
 ctx.fillStyle='#fafafa';ctx.fillRect(0,0,w,h);
 const ox=w/2-px,oy=h/2-py;ctx.save();ctx.translate(ox,oy);
 const groundX0=Math.floor(-ox/TILE)-1,groundX1=Math.ceil((w-ox)/TILE);
 const x0=Math.max(0,groundX0),x1=Math.min(n-1,groundX1);
 const groundY0=Math.floor(-oy/TILE)-1,groundY1=Math.ceil((h-oy)/TILE);
 const y0=Math.max(0,groundY0),y1=Math.min(n-1,groundY1);
 ctx.fillStyle='#fafafa';ctx.fillRect(0,0,n*TILE,n*TILE);
 // Subtle ground pattern, without a trail that reveals the route.
 ctx.fillStyle='#e8e8e8';for(let y=groundY0;y<=groundY1;y++)for(let x=groundX0;x<=groundX1;x++){ctx.fillRect(x*TILE+19,y*TILE+22,2,2);ctx.fillRect(x*TILE+58,y*TILE+61,2,2);}
 if(showFootprints){ctx.fillStyle='#00000024';for(const dot of trailDots()){
 if(dot.x+ox < -4 || dot.x+ox > w+4 || dot.y+oy < -4 || dot.y+oy > h+4)continue;
 ctx.beginPath();ctx.arc(dot.x,dot.y,2.5,0,Math.PI*2);ctx.fill();}}
 // Tall hedge-like walls: shadow, dark edge, green top.
 for(const [color,width,offset] of [['#00000020',16,5],['#111111',12,0],['#363636',7,-2]]){
 ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='square';ctx.beginPath();
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const c=cells[y*n+x],xx=x*TILE,yy=y*TILE;const lines=[[xx,yy,xx+TILE,yy],[xx+TILE,yy,xx+TILE,yy+TILE],[xx,yy+TILE,xx+TILE,yy+TILE],[xx,yy,xx,yy+TILE]];
 c.walls.forEach((wall,d)=>{if(wall){const l=lines[d];ctx.moveTo(l[0]+offset,l[1]+offset);ctx.lineTo(l[2]+offset,l[3]+offset);}});}
 ctx.stroke();}
 const [ex,ey]=center(OUTSIDE);
 const signX=ex+dirs[exitDir][1]*28,signY=ey-dirs[exitDir][0]*28;ctx.fillStyle='#111111';ctx.fillRect(signX-22,signY-9,44,18);ctx.fillStyle='#ffffff';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText('EXIT',signX,signY+4);
 if(player===start&&!segment){ctx.fillStyle='#777777';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText('START',px,py+34);}
 ctx.fillStyle='#00000022';ctx.beginPath();ctx.ellipse(px,py+21,18,5,0,0,Math.PI*2);ctx.fill();
 if(spriteReady){const frame=animationFrame(now);ctx.save();ctx.translate(Math.round(px),Math.round(py));if(facing===1)ctx.scale(-1,1);ctx.drawImage(sprite,frame*48,0,48,48,-24,-24,48,48);ctx.restore();}
 else{ctx.fillStyle='#111111';ctx.beginPath();ctx.arc(px,py,24,0,Math.PI*2);ctx.fill();}
 ctx.restore();
 // Fixed center viewport; only the immediate neighborhood is visible.
 const vignette=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.28,w/2,h/2,Math.max(w,h)*.7);vignette.addColorStop(0,'#00000000');vignette.addColorStop(1,'#00000022');ctx.fillStyle=vignette;ctx.fillRect(0,0,w,h);
}
function tick(now){const dt=lastTime===null?0:Math.min((now-lastTime)/1000,.05);lastTime=now;if(segment&&!paused&&!done){advance(dt,now);markSave();}if(saveDirty&&now-lastSaveAt>=750)saveGame();syncStopButton();draw(now);requestAnimationFrame(tick);}
function openSizes(){if($('size-dialog').open)return;modalResume=!!segment&&!paused;if(modalResume)stop();$('size-dialog').showModal();}
function closeSizes(){ $('size-dialog').close();if(modalResume&&segment&&paused)stop();modalResume=false;}
$('new').onclick=openSizes;$('close-size').onclick=closeSizes;
$('size-dialog').addEventListener('cancel',e=>{e.preventDefault();closeSizes();});$('again').onclick=newGame;$('reset').onclick=reset;
$('footprints').onclick=()=>{showFootprints=!showFootprints;syncFootprintsButton();markSave();saveGame();};
$('stop').onclick=stop;
 document.querySelectorAll('[data-size]').forEach(button=>button.onclick=()=>{selectedSize=Number(button.dataset.size);document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));modalResume=false;$('size-dialog').close();newGame();});
 document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{command(Number(b.dataset.dir));saveGame();});
 document.addEventListener('keydown',e=>{if($('size-dialog').open)return;if(['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();if(!e.repeat)stop();return;}const keys={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3};const d=keys[e.key]??keys[e.key.toLowerCase()];if(d!==undefined){e.preventDefault();if(!e.repeat){command(d);saveGame();}}});

 document.addEventListener('visibilitychange',()=>{lastTime=null;if(document.visibilityState==='hidden'){markSave();saveGame();}});
 window.addEventListener('pagehide',()=>{markSave();saveGame();});
 window.addEventListener('beforeunload',()=>{markSave();saveGame();});
 if(!restoreGame())newGame();syncStopButton();requestAnimationFrame(tick);

</script></body></html>
