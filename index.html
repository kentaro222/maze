<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010"><title>迷路（仮）</title><style>
:root{color-scheme:dark;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#eee;background:#101010;font-synthesis:none}*{box-sizing:border-box}body{margin:0}header{max-width:1100px;margin:auto;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #292929}h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.05em}.version{font-size:11px;color:#888;font-family:ui-monospace,monospace}main{max-width:1100px;margin:20px auto;padding:0 24px 24px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.difficulty{display:flex;align-items:center;gap:12px}label{font-size:12px;color:#aaa;white-space:nowrap}select,button{font:inherit;border:1px solid #444;border-radius:8px;background:#242424;color:#eee}select{padding:10px 12px;font-size:12px}button{cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:background .12s,transform .12s}button:hover{background:#353535}button:active{transform:scale(.96);background:#444}button:focus-visible,select:focus-visible,canvas:focus-visible{outline:2px solid #aaa;outline-offset:3px}.primary{padding:11px 18px;font-size:12px;font-weight:700;background:#ededed;color:#111;border-color:#ededed}.primary:hover{background:#ccc}.stats{display:grid;grid-template-columns:repeat(3,1fr);padding:14px 18px;margin-bottom:14px;background:#191919;border:1px solid #303030;border-radius:10px}.stats div{padding-left:18px;border-right:1px solid #333}.stats div:first-child{padding:0}.stats div:last-child{border:0}.stats small{display:block;font-size:10px;color:#999;margin-bottom:6px}.stats b{font-family:ui-monospace,monospace;font-size:22px;font-weight:500;letter-spacing:.04em}.board{position:relative;overflow:hidden;border-radius:10px;height:clamp(320px,55vh,740px);background:#ddd}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:pan-y}.bottom{display:flex;justify-content:space-between;gap:12px;margin-top:12px}.secondary{padding:10px 14px;font-size:11px}.secondary[aria-pressed="true"]{background:#ddd;color:#111;border-color:#ddd}.dpad{display:grid;grid-template-columns:repeat(3,70px);grid-template-rows:repeat(2,60px);gap:7px;justify-content:center;margin:16px auto 0}.dpad button{height:60px;font-size:25px;border:1px solid #555;box-shadow:0 3px 0 #080808}.dpad button:active{box-shadow:none}.dpad button[data-dir="0"]{grid-area:1/2}.dpad button[data-dir="3"]{grid-area:2/1}.dpad button[data-dir="1"]{grid-area:2/3}.dpad button[data-dir="2"]{grid-area:2/2}.dpad #stop{grid-area:1/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:19px;background:#e4e4e4;color:#111;border-color:#e4e4e4}.dpad #stop:hover{background:#ccc}.dpad #stop small{font-size:10px}.win{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111e;color:#fff;backdrop-filter:blur(5px);text-align:center}.win[hidden]{display:none}.win h2{font-size:25px;margin:0 0 16px}.win p{font-size:13px;color:#ccc}.win button{margin-top:20px}
@media(max-width:650px){header{padding:16px}h1{font-size:20px}main{padding:0 12px 20px;margin:14px auto}.toolbar{gap:8px}.difficulty{gap:8px}label{font-size:11px}select{padding:9px 8px;font-size:11px}.toolbar .primary{padding:10px 12px;font-size:11px}.stats{padding:12px;margin-bottom:12px}.stats div{padding-left:12px}.stats b{font-size:20px}.board{height:clamp(280px,45vh,580px)}.dpad{margin-top:14px}}

header{gap:16px;flex-wrap:wrap}.title{display:flex;gap:12px;align-items:baseline}.header-controls{display:flex;gap:12px;align-items:center}.sizes{display:flex;gap:0}.sizes button{padding:10px 15px;border-radius:0;font-size:12px;border-right:0}.sizes button:first-child{border-radius:8px 0 0 8px}.sizes button:last-child{border-radius:0 8px 8px 0;border-right:1px solid #444}.sizes button[aria-pressed="true"]{background:#eee;color:#111;border-color:#eee}.board{height:clamp(320px,62vh,780px)}
@media(max-width:650px){header{padding:14px 12px;gap:12px}.header-controls{gap:8px;flex-wrap:wrap}.header-controls .primary{padding:10px 12px;font-size:11px}.sizes button{padding:10px 13px;font-size:11px}.board{height:clamp(300px,54vh,640px)}}

header{flex-wrap:nowrap}.title{min-width:0}.title h1{white-space:nowrap}header>.primary{flex-shrink:0}dialog{border:1px solid #444;border-radius:14px;background:#191919;color:#eee;padding:20px;width:min(360px,calc(100vw - 32px));box-shadow:0 15px 60px #0009}dialog::backdrop{background:#0009;backdrop-filter:blur(3px)}.dialog-heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}.dialog-heading h2{font-size:16px;margin:0}.dialog-heading button{font-size:20px;padding:4px 12px}.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sizes button,.sizes button:first-child,.sizes button:last-child{border:1px solid #444;border-radius:8px;padding:14px 0;font-size:13px}.sizes button[aria-pressed="true"]{border-color:#eee}
@media(max-width:420px){header{gap:8px}.title{gap:8px}.title h1{font-size:18px}header>.primary{font-size:11px;padding:10px 12px}}
</style></head>
<body>
<header><div class="title"><h1>迷路（仮）</h1><span class="version">v1.4</span></div><button id="new" class="primary">新規迷路</button></header>
<dialog id="size-dialog" aria-labelledby="size-title"><div class="dialog-heading"><h2 id="size-title">サイズ</h2><button id="close-size" class="secondary" aria-label="閉じる">×</button></div><div class="sizes" role="group" aria-label="迷路のサイズ"><button data-size="15" aria-pressed="false">小</button><button data-size="25" aria-pressed="true">中</button><button data-size="35" aria-pressed="false">大</button><button data-size="51" aria-pressed="false">巨大</button></div></dialog>
<main>
<div class="board"><canvas id="maze" tabindex="0" aria-label="迷路"></canvas><div id="win" class="win" hidden><h2>ゴール</h2><button id="again" class="primary">もう一度</button></div></div>
<div class="bottom"><button id="footprints" class="secondary" aria-pressed="false">足跡：非表示</button><button id="reset" class="secondary">最初から</button></div>
<div class="dpad" aria-label="移動と停止"><button data-dir="0" aria-label="上へ">↑</button><button data-dir="3" aria-label="左へ">←</button><button id="stop" aria-label="停止">■<small>停止</small></button><button data-dir="1" aria-label="右へ">→</button><button data-dir="2" aria-label="下へ">↓</button></div>
</main>
<script>

// player.png: 96×48, left-facing; frame 0 idle, frame 1 walking.
const $=id=>document.getElementById(id),canvas=$('maze'),ctx=canvas.getContext('2d');
const dirs=[[0,-1],[1,0],[0,1],[-1,0]],TILE=80,SPRITE=48,SPEED=85,ZOOM=1.6;
let n,cells,player,start,goal,done=false,segment=null,heading=1,facing=1;
let px=40,py=40,lastTime=null,paused=false,showFootprints=false,footprints=new Map(),footDistance=0;
let selectedSize=25,walkingSince=null,idleAt=0,modalResume=false;
const FRAME_MS=260;
const sprite=new Image();let spriteReady=false;
sprite.onload=()=>{spriteReady=sprite.naturalWidth===96&&sprite.naturalHeight===48;};
sprite.onerror=()=>{spriteReady=false;};
sprite.src='./player.png';
function generate(size,entrance,target){
 const a=Array.from({length:size*size},()=>({walls:[true,true,true,true],seen:false}));
 const nearby=i=>{const x=i%size,y=Math.floor(i/size);return dirs.map(([dx,dy],d)=>({d,j:(y+dy)*size+x+dx,x:x+dx,y:y+dy})).filter(v=>v.x>=0&&v.y>=0&&v.x<size&&v.y<size);};
 const open=(i,d,j)=>{a[i].walls[d]=false;a[j].walls[(d+2)%4]=false;};
 const pick=list=>list[Math.floor(Math.random()*list.length)];
 // Mix depth-first corridors with random frontier growth.
 const active=[entrance];a[entrance].seen=true;
 while(active.length){const k=Math.random()<.75?active.length-1:Math.floor(Math.random()*active.length),i=active[k],options=nearby(i).filter(v=>!a[v.j].seen);
 if(!options.length){active.splice(k,1);continue;}
 const {d,j}=pick(options);open(i,d,j);a[j].seen=true;active.push(j);
 }
 const degree=i=>a[i].walls.filter(w=>!w).length;
 // Join distant passages; reject tiny square loops and open-room clusters.
 function farEnough(from,to){const q=[[from,0]],seen=new Set([from]);for(let k=0;k<q.length;k++){const [i,dist]=q[k];if(i===to)return false;if(dist===6)continue;for(const v of nearby(i)){if(!a[i].walls[v.d]&&!seen.has(v.j)){seen.add(v.j);q.push([v.j,dist+1]);}}}return true;}
 function connect(i){const candidates=nearby(i).filter(v=>a[i].walls[v.d]&&farEnough(i,v.j));if(!candidates.length)return false;const preferred=candidates.filter(v=>degree(v.j)<3);const v=pick(preferred.length?preferred:candidates);open(i,v.d,v.j);return true;}
 const order=Array.from({length:size*size},(_,i)=>i);
 for(let k=order.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];}
 // Most dead ends become routes that rejoin another corridor.
 for(const i of order)if(degree(i)===1&&Math.random()<.85)connect(i);
 // Additional loops across the maze, while keeping walls and corridors.
 let extra=Math.floor(size*size*.045);for(const i of order){if(extra<=0)break;if(degree(i)<3&&connect(i))extra--;}
 // Give the entrance and exit more than one approach when possible.
 for(const i of [entrance,target])if(degree(i)===1)connect(i);
 // Ensure that the exit can be reached by two distinct routes from the entrance.
 const parents=new Map([[entrance,null]]),routeQ=[entrance];
 for(let k=0;k<routeQ.length&&!parents.has(target);k++)for(const v of nearby(routeQ[k]))if(!a[routeQ[k]].walls[v.d]&&!parents.has(v.j)){parents.set(v.j,routeQ[k]);routeQ.push(v.j);}
 let first=target;while(parents.get(first)!==entrance)first=parents.get(first);
 const reached=new Set([entrance]),q=[entrance];
 for(let k=0;k<q.length;k++)for(const v of nearby(q[k])){if((q[k]===entrance&&v.j===first)||(q[k]===first&&v.j===entrance))continue;if(!a[q[k]].walls[v.d]&&!reached.has(v.j)){reached.add(v.j);q.push(v.j);}}
 if(!reached.has(target)){const joins=[];for(const i of reached)for(const v of nearby(i))if(a[i].walls[v.d]&&!reached.has(v.j))joins.push({i,...v});const distant=joins.filter(v=>farEnough(v.i,v.j));const v=pick(distant.length?distant:joins);if(v)open(v.i,v.d,v.j);}
 return a;
}
function next(i,d){return i+dirs[d][0]+dirs[d][1]*n;}
function exits(i){return [0,1,2,3].filter(d=>!cells[i].walls[d]);}
function center(i){return [(i%n+.5)*TILE,(Math.floor(i/n)+.5)*TILE];}
function reset(){player=start;walkingSince=null;idleAt=0;[px,py]=center(player);segment=null;done=false;heading=1;facing=1;paused=false;footprints=new Map();footDistance=0;lastTime=null;$('win').hidden=true;}
function newGame(){n=selectedSize;const middle=Math.floor(n/2);start=middle*n+middle;
 const options=[];for(let i=0;i<n*n;i++){const x=i%n,y=Math.floor(i/n);if(Math.abs(x-middle)+Math.abs(y-middle)>=Math.ceil(n*.4))options.push(i);}
 goal=options[Math.floor(Math.random()*options.length)];cells=generate(n,start,goal);reset();}
function startWalk(now){if(walkingSince===null)walkingSince=now;idleAt=0;}
function finishWalk(now){if(walkingSince!==null){const elapsed=Math.max(0,now-walkingSince),phase=Math.floor(elapsed/FRAME_MS);idleAt=phase%2===1?walkingSince+(phase+1)*FRAME_MS:0;}walkingSince=null;}
function animationFrame(now){if(segment&&!paused&&walkingSince!==null)return Math.floor(Math.max(0,now-walkingSince)/FRAME_MS)%2;return now<idleAt?1:0;}
function begin(d,now=performance.now()){if(done||cells[player].walls[d])return false;paused=false;startWalk(now);heading=d;if(d===1||d===3)facing=d;segment={from:player,to:next(player,d),d,t:0};return true;}
function command(d){
 if(done)return;
 if(segment){
 if(d===segment.d){paused=false;startWalk(performance.now());return;}
 if(d!==(segment.d+2)%4){return;}
 paused=false;startWalk(performance.now());
 // Reverse immediately even between cell centers, preserving position.
 const old=segment;segment={from:old.to,to:old.from,d,t:1-old.t};heading=d;if(d===1||d===3)facing=d;
 return;}
 begin(d);
}
let stopButtonState=null;
function syncStopButton(){const resume=!!segment&&paused;if(resume===stopButtonState)return;stopButtonState=resume;$('stop').innerHTML=resume?'▶<small>再開</small>':'■<small>停止</small>';$('stop').setAttribute('aria-label',resume?'再開':'停止');$('stop').title=resume?'再開':'停止';}
function stop(){if(done)return;if(segment){if(paused){paused=false;startWalk(performance.now());}else{finishWalk(performance.now());paused=true;}}syncStopButton();}
function stamp(x,y,d){const key=Math.round(x/4)+','+Math.round(y/4)+','+d;footprints.set(key,{x,y,d});}
function complete(now=performance.now()){finishWalk(now);done=true;segment=null;$('win').hidden=false;}
function advance(dt,now){
 let remaining=dt*SPEED/TILE;
 while(segment&&!paused&&remaining>0){const move=Math.min(remaining,1-segment.t),oldT=segment.t;segment.t+=move;remaining-=move;
 const distance=move*TILE;let first=22-footDistance;
 while(first<=distance){const t=oldT+first/TILE,[sx,sy]=center(segment.from);stamp(sx+dirs[segment.d][0]*t*TILE,sy+dirs[segment.d][1]*t*TILE,segment.d);first+=22;}
 footDistance=(footDistance+distance)%22;
 const [ax,ay]=center(segment.from),[bx,by]=center(segment.to);px=ax+(bx-ax)*segment.t;py=ay+(by-ay)*segment.t;
 if(segment.t<1)break;
 const arrived=segment.to,arrivalDirection=segment.d;player=arrived;segment=null;
 if(player===goal){complete(now);break;}
 const forward=exits(player).filter(d=>d!==(arrivalDirection+2)%4);
 if(forward.length===1)begin(forward[0],now);else finishWalk(now);
 
 }
}
function resize(){const rect=canvas.getBoundingClientRect(),ratio=Math.min(devicePixelRatio||1,2);const w=Math.round(rect.width*ratio),h=Math.round(rect.height*ratio);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}return [rect.width,rect.height,ratio];}
function draw(now){
 const [viewW,viewH,ratio]=resize();if(!viewW||!viewH)return;const w=viewW/ZOOM,h=viewH/ZOOM;ctx.setTransform(ratio*ZOOM,0,0,ratio*ZOOM,0,0);ctx.imageSmoothingEnabled=false;
 ctx.fillStyle='#dddddd';ctx.fillRect(0,0,w,h);
 const ox=w/2-px,oy=h/2-py;ctx.save();ctx.translate(ox,oy);
 const x0=Math.max(0,Math.floor(-ox/TILE)-1),x1=Math.min(n-1,Math.ceil((w-ox)/TILE));
 const y0=Math.max(0,Math.floor(-oy/TILE)-1),y1=Math.min(n-1,Math.ceil((h-oy)/TILE));
 ctx.fillStyle='#fafafa';ctx.fillRect(0,0,n*TILE,n*TILE);
 // Subtle ground pattern, without a trail that reveals the route.
 ctx.fillStyle='#e8e8e8';for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){ctx.fillRect(x*TILE+19,y*TILE+22,2,2);ctx.fillRect(x*TILE+58,y*TILE+61,2,2);}
 if(showFootprints){ctx.fillStyle='#909090';for(const mark of footprints.values()){if(mark.x+ox < -15 || mark.x+ox > w+15 || mark.y+oy < -15 || mark.y+oy > h+15)continue;ctx.save();ctx.translate(mark.x,mark.y);ctx.rotate(mark.d*Math.PI/2);ctx.fillRect(-8,-5,4,8);ctx.fillRect(4,1,4,8);ctx.restore();}}
 // Tall hedge-like walls: shadow, dark edge, green top.
 for(const [color,width,offset] of [['#00000020',16,5],['#111111',12,0],['#363636',7,-2]]){
 ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='square';ctx.beginPath();
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const c=cells[y*n+x],xx=x*TILE,yy=y*TILE;const lines=[[xx,yy,xx+TILE,yy],[xx+TILE,yy,xx+TILE,yy+TILE],[xx,yy+TILE,xx+TILE,yy+TILE],[xx,yy,xx,yy+TILE]];
 c.walls.forEach((wall,d)=>{if(wall){const l=lines[d];ctx.moveTo(l[0]+offset,l[1]+offset);ctx.lineTo(l[2]+offset,l[3]+offset);}});}
 ctx.stroke();}
 const [gx,gy]=center(goal);ctx.fillStyle='#111111';ctx.fillRect(gx-25,gy-25,50,50);ctx.fillStyle='#ffffff';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText('EXIT',gx,gy+4);
 if(player===start&&!segment){ctx.fillStyle='#777777';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText('START',px,py+34);}
 ctx.fillStyle='#00000022';ctx.beginPath();ctx.ellipse(px,py+21,18,5,0,0,Math.PI*2);ctx.fill();
 if(spriteReady){const frame=animationFrame(now);ctx.save();ctx.translate(Math.round(px),Math.round(py));if(facing===1)ctx.scale(-1,1);ctx.drawImage(sprite,frame*48,0,48,48,-24,-24,48,48);ctx.restore();}
 else{ctx.fillStyle='#111111';ctx.beginPath();ctx.arc(px,py,24,0,Math.PI*2);ctx.fill();}
 ctx.restore();
 // Fixed center viewport; only the immediate neighborhood is visible.
 const vignette=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.28,w/2,h/2,Math.max(w,h)*.7);vignette.addColorStop(0,'#00000000');vignette.addColorStop(1,'#00000022');ctx.fillStyle=vignette;ctx.fillRect(0,0,w,h);
}
function tick(now){const dt=lastTime===null?0:Math.min((now-lastTime)/1000,.05);lastTime=now;if(segment&&!paused&&!done)advance(dt,now);syncStopButton();draw(now);requestAnimationFrame(tick);}
function openSizes(){if($('size-dialog').open)return;modalResume=!!segment&&!paused;if(modalResume)stop();$('size-dialog').showModal();}
function closeSizes(){ $('size-dialog').close();if(modalResume&&segment&&paused)stop();modalResume=false;}
$('new').onclick=openSizes;$('close-size').onclick=closeSizes;
$('size-dialog').addEventListener('cancel',e=>{e.preventDefault();closeSizes();});$('again').onclick=newGame;$('reset').onclick=reset;
$('footprints').onclick=()=>{showFootprints=!showFootprints;$('footprints').setAttribute('aria-pressed',String(showFootprints));$('footprints').textContent=showFootprints?'足跡：表示':'足跡：非表示';};
$('stop').onclick=stop;
 document.querySelectorAll('[data-size]').forEach(button=>button.onclick=()=>{selectedSize=Number(button.dataset.size);document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));modalResume=false;$('size-dialog').close();newGame();});
 document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>command(Number(b.dataset.dir)));
 document.addEventListener('keydown',e=>{if($('size-dialog').open)return;if(['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();if(!e.repeat)stop();return;}const keys={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3};const d=keys[e.key]??keys[e.key.toLowerCase()];if(d!==undefined){e.preventDefault();if(!e.repeat)command(d);}});

 document.addEventListener('visibilitychange',()=>{lastTime=null;});
 newGame();syncStopButton();requestAnimationFrame(tick);

</script></body></html>
